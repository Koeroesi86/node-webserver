name: Branch build

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # the version script compares the packages with the commit of their latest release
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Setup
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
      - name: Package bundle
        timeout-minutes: 10
        run: pnpm build
      - name: Package version
        timeout-minutes: 5
        run: pnpm generate-version
      - name: Package information
        timeout-minutes: 5
        run: pnpm -r publish --dry-run --no-git-checks

  # the load test (and its comparison with the base) only runs when the tests and the build passed
  load-test:
    needs: [test, build]
    uses: ./.github/workflows/load-test.yml
