name: Load test

on:
  pull_request:
    branches:
      - master
    paths:
      - 'packages/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/load-test.yml'
  workflow_dispatch:
    inputs:
      vus:
        description: Concurrent virtual users
        default: '20'
      duration:
        description: Test duration (k6 format, e.g. 30s, 2m)
        default: '30s'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORT_HTTP: '8080'
      PORT_HTTPS: '8443'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Setup
        run: pnpm install --frozen-lockfile
      - name: Package bundle
        run: pnpm build
      - name: Runner resources and cores for the server and k6
        run: |
          cores=$(nproc)
          echo "cores: ${cores}, memory: $(free -h | awk '/Mem:/ {print $2}')"
          # The server and k6 get cores of their own, so that they do not take them from each other and the results depend less on how the runner schedules them.
          # k6 needs about 70% of a core for what the server does with 3, so it gets one core in four (at least one) and the server the rest.
          if [ "${cores}" -ge 2 ]; then
            k6_count=$(( cores / 4 > 1 ? cores / 4 : 1 ))
            server_last=$(( cores - k6_count - 1 ))
            {
              echo "SERVER_PREFIX=taskset -c 0-${server_last}"
              echo "K6_PREFIX=taskset -c $(( server_last + 1 ))-$(( cores - 1 ))"
              echo "SERVER_CORE_COUNT=$(( server_last + 1 ))"
            } >> "$GITHUB_ENV"
            echo "the server runs on cores 0-${server_last}, k6 on cores $(( server_last + 1 ))-$(( cores - 1 ))"
          else
            echo "SERVER_CORE_COUNT=${cores}" >> "$GITHUB_ENV"
            echo 'one core: the server and k6 share it'
          fi
      - name: Certificate for the HTTPS routes
        run: |
          mkdir -p packages/node-webserver/.certificates/localhost
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=secure.localhost" -addext "subjectAltName=DNS:secure.localhost" \
            -keyout packages/node-webserver/.certificates/localhost/privkey.pem -out packages/node-webserver/.certificates/localhost/cert.pem
      - name: Start example server
        run: |
          # the prefix is empty on a runner with one core, and is meant to be split into words
          # shellcheck disable=SC2086
          $SERVER_PREFIX node packages/node-webserver/dist/scripts/load-test-server.js > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null -H 'Host: web.localhost' "http://localhost:${PORT_HTTP}"; then
              exit 0
            fi
            sleep 1
          done
          echo 'Server did not become ready' >&2
          cat server.log
          exit 1
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.2.2'
      - name: Run load test
        env:
          # passed through the environment rather than interpolated into the script
          VUS: ${{ inputs.vus || '20' }}
          DURATION: ${{ inputs.duration || '30s' }}
        run: |
          # the throughput floor was calibrated at 250 requests per second and core of the server
          # shellcheck disable=SC2086
          $K6_PREFIX k6 run \
            --summary-export=k6-summary.json \
            -e BASE_URL="http://localhost:${PORT_HTTP}" \
            -e HTTPS_PORT="${PORT_HTTPS}" \
            -e MIN_REQUEST_RATE="$(( SERVER_CORE_COUNT * 250 ))" \
            packages/node-webserver/load-tests/example.js
      # on its own, as other traffic would take the cores that its workers need
      - name: Run CPU bound load test
        if: always()
        run: |
          # shellcheck disable=SC2086
          $K6_PREFIX k6 run \
            --summary-export=k6-cpu-summary.json \
            -e BASE_URL="http://localhost:${PORT_HTTP}" \
            packages/node-webserver/load-tests/cpu.js
      - name: Summarize results
        if: always()
        run: |
          node packages/node-webserver/load-tests/summary.js k6-summary.json server.log >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          node packages/node-webserver/load-tests/summary.js k6-cpu-summary.json '' 'Load test: CPU bound worker' >> "$GITHUB_STEP_SUMMARY"
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" || echo 'The server had already stopped.'
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-test-results
          path: |
            k6-summary.json
            k6-cpu-summary.json
            server.log
          if-no-files-found: ignore
