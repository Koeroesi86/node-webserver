name: Pull request checks

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the version script compares the packages with the commit of their latest release
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Setup
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
      - name: Package bundle
        timeout-minutes: 10
        run: pnpm build
      - name: Package version
        timeout-minutes: 5
        run: pnpm generate-version
      - name: Package information
        timeout-minutes: 5
        run: pnpm -r publish --dry-run --no-git-checks

  # the findings that the change itself introduces, now that complexity is an error: the whole-repository check runs in the test job, this one names the files of the pull request
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the audit compares the files with the base branch
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Setup
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
      - name: Package bundle
        timeout-minutes: 10
        run: pnpm build
      # the coverage of the tests makes the CRAP scores of the changed functions exact, and a score of 30 or more fails the audit
      - name: Unit tests with coverage
        timeout-minutes: 10
        run: |
          pnpm test:coverage
          pnpm coverage:merge
      - name: Code quality of the changed files
        timeout-minutes: 5
        run: pnpm exec fallow audit --base origin/master --coverage coverage/coverage-final.json --max-crap 30

  # the description follows the template of the repository. It is read when the job runs, so edit the description and re-run the job instead of pushing
  description:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Setup
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the tools
        timeout-minutes: 5
        run: pnpm --filter @koeroesi86/tools build
      # the description is untrusted: it only goes through a file, never into a command
      - name: Check the description
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          gh pr view "${PR_NUMBER}" --json body --jq .body > "${RUNNER_TEMP}/description.md"
          node tools/dist/scripts/check-pull-request.js "${RUNNER_TEMP}/description.md"

  # the files that the pull request adds follow the layout rules of CLAUDE.md (names, index.ts, one export and a test in utils/); the existing files break them, so only added ones are checked
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the added files are found against the merge base with the base branch
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Setup
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the tools
        timeout-minutes: 5
        run: pnpm --filter @koeroesi86/tools build
      - name: Check the added files
        timeout-minutes: 5
        run: node tools/dist/scripts/check-layout.js origin/master

  # the site of docs/ builds, which also fails on a link that leads nowhere
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Setup
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the site
        timeout-minutes: 5
        run: pnpm docs:build

  # the load test (and its comparison with the base) only runs when the tests and the build passed
  load-test:
    needs: [test, build]
    uses: ./.github/workflows/load-test.yml

  # the ACME client against Pebble, the test server of Let's Encrypt, as the fake server of the unit tests is written together with the client and would share its misreading of RFC 8555.
  # Both run on the host network: Pebble asks the name server of challtestsrv (which answers 127.0.0.1 for every name) and then the http port of the server under test.
  pebble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PEBBLE_IMAGE: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
      CHALLTESTSRV_IMAGE: ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1@sha256:12ce21884def456bcf9786542113949e1f19dc7738d2c70e156c2d0c38a1405b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Setup
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
      - name: Package bundle
        timeout-minutes: 10
        run: pnpm build
      - name: Start Pebble
        timeout-minutes: 5
        run: |
          # only its name server is wanted: its own http challenge server would hold the port 5002 that the server under test answers the challenge on
          docker run -d --name challtestsrv --network host "${CHALLTESTSRV_IMAGE}" -defaultIPv6 "" -defaultIPv4 127.0.0.1 -http01 "" -https01 "" -tlsalpn01 "" -doh ""
          docker run -d --name pebble --network host -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_VA_ALWAYS_VALID=0 "${PEBBLE_IMAGE}" \
            -config test/config/pebble-config.json -strict -dnsserver 127.0.0.1:8053
          docker cp pebble:/test/certs/pebble.minica.pem "${RUNNER_TEMP}/pebble.minica.pem"
          until curl --silent --fail --cacert "${RUNNER_TEMP}/pebble.minica.pem" https://localhost:14000/dir > /dev/null; do sleep 1; done
      - name: Integration test against Pebble
        timeout-minutes: 5
        env:
          PEBBLE_DIRECTORY: https://localhost:14000/dir
          PEBBLE_ROOTS: https://localhost:15000/roots/0
          # the port of the http challenge in the configuration of Pebble
          PEBBLE_HTTP_PORT: '5002'
        run: |
          export PEBBLE_CA="${RUNNER_TEMP}/pebble.minica.pem"
          pnpm --filter @koeroesi86/node-webserver exec jest -c integration/jest.config.js pebble
      - name: Logs of Pebble
        if: failure()
        run: docker logs pebble

  security:
    uses: ./.github/workflows/security.yml

  # the one check that master requires: it fails unless the tests, the build, the audit, the description, the layout check, the docs build, the Pebble test, the load test and the security scans all passed,
  # so the jobs and the operating systems can change without touching the branch protection
  required-checks:
    if: always()
    needs: [test, build, audit, description, layout, docs, pebble, load-test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tests, build, audit, description, layout, docs, Pebble test, load test and security scans passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          for result in ${RESULTS}; do
            [ "${result}" = "success" ] || exit 1
          done
