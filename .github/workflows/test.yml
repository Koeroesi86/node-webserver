name: Test

# lint, unit and integration tests, used by the workflows that build and publish
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: ./.github/actions/pnpm-store
      - name: Setup
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
      - name: Package bundle
        timeout-minutes: 10
        run: pnpm build
      - name: Lint
        timeout-minutes: 5
        run: pnpm lint
      - name: Unit tests with coverage
        timeout-minutes: 10
        run: pnpm test:coverage
      - name: Coverage summary
        if: runner.os == 'Linux' && !cancelled()
        run: cat coverage/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage/report.md
            coverage/report.json
            packages/*/coverage/lcov-report
          if-no-files-found: ignore
          retention-days: 14
      # unused code, duplication and complexity, which eslint does not see across the packages. It reads the source, so one system is enough, and the coverage
      # of another one has other tests skipped (the load test runner is not tested on Windows), which would make its functions look untested.
      - name: Code quality
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: |
          pnpm coverage:merge
          pnpm fallow:ci
      # one server of every type, started from the bundle
      - name: Integration tests
        timeout-minutes: 5
        run: pnpm test:integration
