name: Test

# lint, unit and integration tests, used by the workflows that build and publish
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Persist cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache
          # a cache is never updated once saved, so every run saves one of its own and starts from the latest one of the same lockfile
          key: ${{ runner.os }}-local-dot-cache-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-local-dot-cache-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-local-dot-cache-
      - name: Setup
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
      - name: Package bundle
        timeout-minutes: 10
        run: pnpm build
      - name: Lint
        timeout-minutes: 5
        run: pnpm lint
      - name: Unit tests
        timeout-minutes: 10
        run: pnpm test
      # one server of every type, started from the bundle
      - name: Integration tests
        timeout-minutes: 5
        run: pnpm test:integration
