name: Cache cleanup

# the caches of a pull request are only visible to it, so they are of no use once it is closed
on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete the caches of the pull request
    # the token of a pull request from a fork cannot write, its caches expire after 7 days
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # deleting a cache
      actions: write
    steps:
      - name: Delete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CACHE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: gh cache list --ref "$CACHE_REF" --limit 100 --json id --jq '.[].id' | xargs -r -n1 gh cache delete
