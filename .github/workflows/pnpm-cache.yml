name: pnpm cache

# pull requests can read the caches of master and their own but not those of each other, so master saves the pnpm store that they restore (.github/actions/pnpm-store), and nothing else saves one.
# a cache that is not read for 7 days is deleted by GitHub, hence the schedule.
# a pull request that changes the action or this file runs it too, to see that it works on the three systems before it is merged (it saves nothing).
on:
  pull_request:
    paths:
      - '.github/actions/pnpm-store/**'
      - '.github/workflows/pnpm-cache.yml'
  push:
    branches:
      - master
    paths:
      - 'pnpm-lock.yaml'
      - '.github/actions/pnpm-store/**'
      - '.github/workflows/pnpm-cache.yml'
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-store:
    name: pnpm store (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: ./.github/actions/pnpm-store
        id: store
      - name: Setup
        if: steps.store.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Save the store
        if: github.ref == 'refs/heads/master' && steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ steps.store.outputs.key }}
