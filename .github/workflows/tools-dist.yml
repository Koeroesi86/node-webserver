name: Build the tools

# builds tools/dist for the workflows that run it with GH_REBASE_TOKEN, so that the dependencies are installed in a job without the token
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # no cache: what runs with the token is not built from a restored one
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Setup
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @koeroesi86/tools
      - name: Build the tools
        timeout-minutes: 5
        run: pnpm --filter @koeroesi86/tools build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-dist
          path: tools/dist
          retention-days: 1
          if-no-files-found: error
